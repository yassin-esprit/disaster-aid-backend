# ?? Application ??????????????????????????????????????????????????????????????
spring.application.name=disasteraidbackend
server.port=8090

# ?? PostgreSQL + PostGIS ??????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5432/disaster_aid
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate Spatial ???????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ?? JWT ???????????????????????????????????????????????????????????????????????
# Change this secret in production (min 32 characters, base64 or random string)
app.jwt.secret=disaster-aid-super-secret-key-change-in-production-32ch
app.jwt.expiration-ms=86400000

# ?? Caching (Caffeine) ????????????????????????????????????????????????????????
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# ?? Email (JavaMailSender) ????????????????????????????????????????????????????
# Uncomment and fill in to enable email notifications
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ?? CORS (allow Angular dev server) ??????????????????????????????????????????
spring.web.cors.allowed-origins=http://localhost:4200
logging.level.org.springframework.security=DEBUG
logging.level.tn.esprit.disasteraidbackend.security=DEBUG